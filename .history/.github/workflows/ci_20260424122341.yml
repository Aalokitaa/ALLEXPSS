name: Fullstack Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and Run Backend Tests
        run: |
          # Case-insensitive find for the backend folder
          TARGET_DIR=$(find . -type d -iname "backend" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Could not find a 'backend' folder!"
            exit 1
          fi
          
          cd "$TARGET_DIR"
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pytest

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 is required for modern Vitest versions
          node-version: 22

      - name: Install and Run Frontend Tests
        run: |
          # Finds your 'frontend' folder regardless of casing
          TARGET_DIR=$(find . -type d -iname "frontend" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find . -type d -iname "frontend-test" | head -n 1)
          fi

          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Could not find 'frontend' folder!"
            exit 1
          fi
          
          cd "$TARGET_DIR"
          echo "Current directory: $(pwd)"
          
          # List files so you can see if your test files are named correctly in the logs
          ls -R

          npm install
          
          # Ensure execution permissions for the binary
          chmod +x node_modules/.bin/vitest || true
          
          # --run: Runs tests once (don't watch)
          # --dir .: Forces it to scan the current directory for test files
          npx vitest --run --dir .