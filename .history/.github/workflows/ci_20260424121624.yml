name: Fullstack Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files for debugging
        run: |
          echo "Listing all files in the repo to find the right path:"
          find . -maxdepth 3 -not -path '*/.*'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and Run Tests
        run: |
          # Use a case-insensitive search to find the directory
          # and then move into it.
          TARGET_DIR=$(find . -type d -iname "backend" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Could not find a 'backend' folder anywhere!"
            exit 1
          fi
          
          cd "$TARGET_DIR"
          echo "Moving into $TARGET_DIR"
          
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pytest

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install and Run Frontend
        run: |
          # Similarly find the frontend folder regardless of case
          TARGET_DIR=$(find . -type d -iname "frontend" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Could not find 'frontend-test' folder!"
            exit 1
          fi
          
          cd "$TARGET_DIR"
          npm install
          npm run test -- --run