name: Fullstack Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        # Adjusted to lowercase 'backend' based on your previous message
        # If the folder is literally named 'backend-test', keep it as is.
        working-directory: Testing/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # This caches your pip dependencies so tests run faster next time
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run backend tests
        run: pytest

  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        # Adjusted to lowercase to match typical naming conventions
        working-directory: Testing/frontend-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: Testing/frontend-test/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run frontend tests
        run: npm run test -- --run