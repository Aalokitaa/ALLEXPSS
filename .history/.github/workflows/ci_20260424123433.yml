name: Fullstack Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and Run Backend Tests
        run: |
          TARGET_DIR=$(find . -type d -iname "backend" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Could not find a 'backend' folder!"
            exit 1
          fi
          
          cd "$TARGET_DIR"
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pytest

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Run Frontend Tests
        run: |
          TARGET_DIR=$(find . -type d -iname "frontend" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find . -type d -iname "frontend-test" | head -n 1)
          fi

          cd "$TARGET_DIR"
          npm install
          
          # We use --environment jsdom if you are testing UI/DOM elements
          # Otherwise 'node' is fine. 
          npx vitest --run