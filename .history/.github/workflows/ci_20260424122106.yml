name: Fullstack Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and Run Backend Tests
        run: |
          # Finds the backend folder regardless of 'Backend' vs 'backend' casing
          TARGET_DIR=$(find . -type d -iname "backend" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Could not find a 'backend' folder!"
            exit 1
          fi
          
          cd "$TARGET_DIR"
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pytest

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Run Frontend Tests
        run: |
          # Tries to find 'frontend' first, then 'frontend-test' as a backup
          TARGET_DIR=$(find . -type d -iname "frontend" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find . -type d -iname "frontend-test" | head -n 1)
          fi

          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Could not find 'frontend' or 'frontend-test' folder!"
            # List directories to help you debug if it fails again
            ls -R
            exit 1
          fi
          
          cd "$TARGET_DIR"
          echo "Moving into: $TARGET_DIR"
          
          npm install
          # Fix permission denied for vitest
          chmod +x node_modules/.bin/vitest || true
          npx vitest --run