name: Fullstack Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and Run Backend Tests
        run: |
          # Finds the backend folder regardless of 'Backend' vs 'backend' casing
          TARGET_DIR=$(find . -type d -iname "backend" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Could not find a 'backend' folder!"
            exit 1
          fi
          
          cd "$TARGET_DIR"
          echo "Current directory: $(pwd)"
          
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
          # Runs pytest in the backend directory
          pytest

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Upgraded to 22 to fix the 'Unsupported engine' error for Vitest
          node-version: 22

      - name: Install and Run Frontend Tests
        run: |
          # Finds the frontend folder regardless of case
          TARGET_DIR=$(find . -type d -iname "frontend-test" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Could not find 'frontend-test' folder!"
            exit 1
          fi
          
          cd "$TARGET_DIR"
          echo "Current directory: $(pwd)"
          
          # Install dependencies
          npm install
          
          # Fix 'Permission denied' by giving execution rights to the vitest binary
          chmod +x node_modules/.bin/vitest
          
          # Run tests using npx for better compatibility in CI
          npx vitest --run